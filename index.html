<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2f2" />
    <title>WelliPay Provider | ABC Healthcare</title>
    <link rel="stylesheet" href="_ds/styles.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  </head>
  <body>
    <div id="auth-root"></div>
    <div class="app-shell" id="app-shell" style="display:none">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" aria-label="WelliPay Provider home">
          <span class="brand-mark"></span>
          <span><strong>WelliPay</strong><small>PROVIDER</small></span>
        </a>
        <div class="tenant">
          <strong>ABC Healthcare</strong>
          <span>Multi-branch hospital · 5 branches</span>
        </div>
        <nav id="navigation"></nav>
        <div class="sidebar-foot"><span class="status-dot"></span> All systems operational</div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" data-action="toggle-menu">
            <span class="menu-glyph"></span>
          </button>
          <div class="topbar-title" id="page-title">Dashboard</div>
          <div class="topbar-tools">
            <label class="branch-picker">
              <span class="sr-only">Branch</span>
              <select id="branch-select" aria-label="Select branch">
                <option>All branches</option><option>Wuse</option><option>Garki</option><option>Maitama</option><option>Kaduna</option><option>Lagos</option>
              </select>
            </label>
            <span class="role-tag" id="topbar-role">Finance Manager</span>
            <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode" data-action="toggle-theme" title="Toggle dark mode">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
            <button class="avatar" type="button" id="topbar-avatar" aria-label="Account" data-action="open-profile-menu">AO</button>
          </div>
        </header>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </div>
    <div class="scrim" id="scrim" data-action="close-menu"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
